name: Xim Linux and macOS builds

# Build and test the supported release platforms. Windows remains deferred.
on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04-x64
            runner: ubuntu-24.04
          - platform: macos-x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install Ubuntu toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 libc++-19-dev libc++abi-19-dev ninja-build libncurses-dev libnsl-dev
          echo 'CC=clang-19' >> "$GITHUB_ENV"
          echo 'CXX=clang++-19' >> "$GITHUB_ENV"

      - name: Install macOS toolchain
        if: runner.os == 'macOS'
        run: |
          brew install llvm ninja
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo 'CC=clang' >> "$GITHUB_ENV"
          echo 'CXX=clang++' >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build/platform-probe -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Test Darwin filesystem operations and file identity
        if: runner.os == 'macOS'
        run: |
          cmake --build build/platform-probe --target xim_fsops_test xim_file_stat_test --parallel 4
          ctest --test-dir build/platform-probe -R '^xim_(fsops|file_stat)$' --output-on-failure

      # Collect independent compile failures in one platform bring-up run.
      # This remains a failing build when any target fails.
      - name: Build macOS (report all compile failures)
        if: runner.os == 'macOS'
        run: cmake --build build/platform-probe --parallel 4 -- -k 0

      - name: Build
        if: runner.os == 'Linux'
        run: cmake --build build/platform-probe --parallel 4

      - name: Test native editor
        run: ctest --test-dir build/platform-probe -L xim_native --output-on-failure

      - name: Package Ubuntu candidate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package=xim-0.0.0-ubuntu24.04-x86_64
          mkdir -p build/packages
          cmake --install build/platform-probe --prefix "$PWD/build/packages/$package"
          rm "$PWD/build/packages/$package/bin/vim"
          cp LICENSE "$PWD/build/packages/$package/LICENSE"
          cp cmake/UBUNTU_RELEASE.txt "$PWD/build/packages/$package/README.txt"
          tar -C build/packages -czf "build/packages/$package.tar.gz" "$package"
          (cd build/packages && sha256sum "$package.tar.gz" > SHA256SUMS)
          mkdir -p build/package-test
          tar -C build/package-test -xzf "build/packages/$package.tar.gz"
          ldd "build/package-test/$package/bin/xim" | tee build/packages/dependencies.txt
          if grep -q 'not found' build/packages/dependencies.txt; then exit 1; fi
          python3 cmake/test_xim.py \
            --binary "$PWD/build/package-test/$package/bin/xim" \
            --work "$PWD/build/package-test/work"
          (cd build/packages && sha256sum -c SHA256SUMS)

      - name: Test Ubuntu candidate in a clean container
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package=xim-0.0.0-ubuntu24.04-x86_64
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/build/package-test/$package:/opt/xim:ro" \
            ubuntu:24.04 bash -ec '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                libc++1-19 libc++abi1-19 libtinfo6 python3
              ldd /opt/xim/bin/xim | tee /tmp/dependencies.txt
              ! grep -q "not found" /tmp/dependencies.txt
              python3 /src/cmake/test_xim.py --binary /opt/xim/bin/xim --work /tmp/xim-work
            '

      - name: Upload Ubuntu candidate
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: xim-0.0.0-ubuntu24.04-x86_64-candidate
          path: |
            build/packages/xim-0.0.0-ubuntu24.04-x86_64.tar.gz
            build/packages/SHA256SUMS
            build/packages/dependencies.txt
          if-no-files-found: error

      - name: Package macOS candidate
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          package=xim-0.0.0-macos15-x86_64
          mkdir -p build/packages
          cmake --install build/platform-probe --prefix "$PWD/build/packages/$package"
          rm "$PWD/build/packages/$package/bin/vim"
          cp LICENSE "$PWD/build/packages/$package/LICENSE"
          cp cmake/MACOS_RELEASE.txt "$PWD/build/packages/$package/README.txt"
          pixman_prefix="$(brew --prefix pixman)"
          mkdir -p "$PWD/build/packages/$package/lib"
          cp "$pixman_prefix/lib/libpixman-1.0.dylib" \
            "$PWD/build/packages/$package/lib/libpixman-1.0.dylib"
          install_name_tool \
            -change "$pixman_prefix/lib/libpixman-1.0.dylib" \
            '@executable_path/../lib/libpixman-1.0.dylib' \
            "$PWD/build/packages/$package/bin/xim"
          install_name_tool -id '@rpath/libpixman-1.0.dylib' \
            "$PWD/build/packages/$package/lib/libpixman-1.0.dylib"
          pixman_license="$(find "$pixman_prefix/share/doc" -maxdepth 3 \
            -type f \( -iname COPYING -o -iname LICENSE \) -print -quit)"
          test -n "$pixman_license"
          cp "$pixman_license" "$PWD/build/packages/$package/lib/PIXMAN-LICENSE.txt"
          tar -C build/packages -czf "build/packages/$package.tar.gz" "$package"
          (cd build/packages && shasum -a 256 "$package.tar.gz" > SHA256SUMS)
          mkdir -p build/package-test
          tar -C build/package-test -xzf "build/packages/$package.tar.gz"
          otool -L "build/package-test/$package/bin/xim" | tee build/packages/dependencies.txt
          otool -L "build/package-test/$package/lib/libpixman-1.0.dylib" \
            | tee -a build/packages/dependencies.txt
          if grep -E '/usr/local/|/opt/homebrew/' build/packages/dependencies.txt; then
            echo 'The macOS package links to a Homebrew library.' >&2
            exit 1
          fi
          python3 cmake/test_xim.py \
            --binary "$PWD/build/package-test/$package/bin/xim" \
            --work "$PWD/build/package-test/work"
          (cd build/packages && shasum -a 256 -c SHA256SUMS)

      - name: Upload macOS candidate
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: xim-0.0.0-macos15-x86_64-candidate
          path: |
            build/packages/xim-0.0.0-macos15-x86_64.tar.gz
            build/packages/SHA256SUMS
            build/packages/dependencies.txt
          if-no-files-found: error
