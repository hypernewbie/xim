name: Xim native platform probe

# This is a bring-up diagnostic, not a release workflow. A platform must build
# and pass native tests before it can produce a release artifact.
on:
  workflow_dispatch:
  push:
    branches:
      - release/platform-bringup

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04-x64
            runner: ubuntu-24.04
          - platform: macos-x64
            runner: macos-15-intel
          - platform: windows-x64
            runner: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Ubuntu toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 libc++-19-dev libc++abi-19-dev ninja-build libncurses-dev libnsl-dev
          echo 'CC=clang-19' >> "$GITHUB_ENV"
          echo 'CXX=clang++-19' >> "$GITHUB_ENV"

      - name: Install macOS toolchain
        if: runner.os == 'macOS'
        run: |
          brew install llvm ninja
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo 'CC=clang' >> "$GITHUB_ENV"
          echo 'CXX=clang++' >> "$GITHUB_ENV"

      - name: Set Windows SDK environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set Windows Clang compilers and CMake
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          clang-cl --version
          python -m pip install 'cmake>=4.2,<5'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cmakeBin = python -c "import cmake; print(cmake.CMAKE_BIN_DIR)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cmakeBin >> $env:GITHUB_PATH
          "CC=clang-cl" >> $env:GITHUB_ENV
          "CXX=clang-cl" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake -S . -B build/platform-probe -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Test Darwin filesystem operations and file identity
        if: runner.os == 'macOS'
        run: |
          cmake --build build/platform-probe --target xim_fsops_test xim_file_stat_test --parallel 4
          ctest --test-dir build/platform-probe -R '^xim_(fsops|file_stat)$' --output-on-failure

      # Collect independent compile failures in one platform bring-up run.
      # This remains a failing build when any target fails.
      - name: Build macOS and Windows (report all compile failures)
        if: runner.os != 'Linux'
        run: cmake --build build/platform-probe --parallel 4 -- -k 0

      - name: Build
        if: runner.os == 'Linux'
        run: cmake --build build/platform-probe --parallel 4

      - name: Test Windows inherited engine
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          cmake --build build/platform-probe --target vim xxd json_test kword_test memfile_test message_test xim_file_identity_win_test --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/platform-probe/src/vim.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/platform-probe -R '^(vim_unit_(json|kword|memfile|message)|xim_file_identity_win)$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test native editor
        run: ctest --test-dir build/platform-probe -L xim_native --output-on-failure

      - name: Package Ubuntu candidate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package=xim-0.0.0-ubuntu24.04-x86_64
          mkdir -p build/packages
          cmake --install build/platform-probe --prefix "$PWD/build/packages/$package"
          rm "$PWD/build/packages/$package/bin/vim"
          cp LICENSE "$PWD/build/packages/$package/LICENSE"
          cp cmake/UBUNTU_RELEASE.txt "$PWD/build/packages/$package/README.txt"
          tar -C build/packages -czf "build/packages/$package.tar.gz" "$package"
          (cd build/packages && sha256sum "$package.tar.gz" > SHA256SUMS)
          mkdir -p build/package-test
          tar -C build/package-test -xzf "build/packages/$package.tar.gz"
          ldd "build/package-test/$package/bin/xim" | tee build/packages/dependencies.txt
          if grep -q 'not found' build/packages/dependencies.txt; then exit 1; fi
          python3 cmake/test_xim.py \
            --binary "$PWD/build/package-test/$package/bin/xim" \
            --work "$PWD/build/package-test/work"
          (cd build/packages && sha256sum -c SHA256SUMS)

      - name: Test Ubuntu candidate in a clean container
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package=xim-0.0.0-ubuntu24.04-x86_64
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/build/package-test/$package:/opt/xim:ro" \
            ubuntu:24.04 bash -ec '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                libc++1-19 libc++abi1-19 libtinfo6 python3
              ldd /opt/xim/bin/xim | tee /tmp/dependencies.txt
              ! grep -q "not found" /tmp/dependencies.txt
              python3 /src/cmake/test_xim.py --binary /opt/xim/bin/xim --work /tmp/xim-work
            '

      - name: Upload Ubuntu candidate
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: xim-0.0.0-ubuntu24.04-x86_64-candidate
          path: |
            build/packages/xim-0.0.0-ubuntu24.04-x86_64.tar.gz
            build/packages/SHA256SUMS
            build/packages/dependencies.txt
          if-no-files-found: error
